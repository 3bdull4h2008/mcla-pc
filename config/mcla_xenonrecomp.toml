# Dispatch guard for sub_8218CC70 (see src/dispatch_guard.cpp): replaces the
# SAFETY block a previous session hand-patched into generated/ppc_recomp.9.cpp,
# which regens silently dropped. Same address + after_instruction placement.
[[midasm_hook]]
name = "mcla_DispatchGuard_8218CC94"
address = 0x8218CC94
registers = ["r3", "r8"]
after_instruction = true
return_on_true = true



