# Session 75l: UI streamables texture-list loader. XenonRecomp missed this
# as a function start (IDA size 0x2B4). Without it the game never opens
# "$/resources/ui/textures/streamables*" and named UI textures never
# register. Explicit boundary so it gets recompiled + mapped.
[[main.functions]]
address = 0x82216B98
size = 0x2B4

